<svg xmlns="http://www.w3.org/2000/svg" width="500" height="780" viewBox="0 0 500 780">
  <rect width="500" height="780" fill="#f8f9fa" rx="10"/>

  <text x="250" y="35" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="18" font-weight="700" fill="#2c3e50">巡逻机器人工作流程</text>

  <defs>
    <marker id="a2" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#555"/>
    </marker>
  </defs>

  <!-- 步骤1：启动 -->
  <rect x="100" y="60" width="300" height="50" rx="8" fill="#2ecc71"/>
  <text x="250" y="82" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="13" fill="#fff">1. 启动系统</text>
  <text x="250" y="100" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="10" fill="#d5f5e3">启动驱动 → 建图/导航 → 巡逻节点</text>

  <line x1="250" y1="110" x2="250" y2="135" stroke="#555" stroke-width="2" marker-end="url(#a2)"/>

  <!-- 步骤2：初始化 -->
  <rect x="100" y="135" width="300" height="50" rx="8" fill="#3498db"/>
  <text x="250" y="157" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="13" fill="#fff">2. 初始化位姿</text>
  <text x="250" y="175" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="10" fill="#d4e6f1">设置起点，等待 Nav2 就绪</text>

  <line x1="250" y1="185" x2="250" y2="210" stroke="#555" stroke-width="2" marker-end="url(#a2)"/>

  <!-- 步骤3：语音播报 -->
  <rect x="100" y="210" width="300" height="40" rx="8" fill="#e74c3c"/>
  <text x="250" y="235" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="13" fill="#fff">3. 语音："正在初始化位置"</text>

  <line x1="250" y1="250" x2="250" y2="275" stroke="#555" stroke-width="2" marker-end="url(#a2)"/>

  <!-- 步骤4：循环 -->
  <rect x="80" y="275" width="340" height="40" rx="8" fill="#fff" stroke="#555" stroke-width="2" stroke-dasharray="5,3"/>
  <text x="250" y="300" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="13" fill="#555">4. 循环：依次前往每个路径点</text>

  <line x1="250" y1="315" x2="250" y2="340" stroke="#555" stroke-width="2" marker-end="url(#a2)"/>

  <!-- 步骤5：导航 -->
  <rect x="100" y="340" width="300" height="50" rx="8" fill="#3498db"/>
  <text x="250" y="362" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="13" fill="#fff">5. 自主导航到目标点</text>
  <text x="250" y="380" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="10" fill="#d4e6f1">Nav2 规划路径 + 避障行驶</text>

  <line x1="250" y1="390" x2="250" y2="415" stroke="#555" stroke-width="2" marker-end="url(#a2)"/>

  <!-- 步骤6：区域识别 -->
  <rect x="100" y="415" width="300" height="50" rx="8" fill="#f39c12"/>
  <text x="250" y="437" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="13" fill="#fff">6. 识别当前区域</text>
  <text x="250" y="455" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="10" fill="#fef9e7">TF获取位姿 → 匹配区域边界 → "客厅"</text>

  <line x1="250" y1="465" x2="250" y2="490" stroke="#555" stroke-width="2" marker-end="url(#a2)"/>

  <!-- 步骤7：四方向拍照 -->
  <rect x="60" y="490" width="380" height="120" rx="8" fill="#fff" stroke="#e74c3c" stroke-width="2"/>
  <text x="250" y="512" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="13" fill="#c0392b" font-weight="600">7. 原地转向4个方向拍照</text>

  <rect x="75" y="522" width="80" height="75" rx="6" fill="#e74c3c"/>
  <text x="115" y="555" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="12" fill="#fff">前方</text>
  <text x="115" y="572" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="9" fill="#fde">0°</text>

  <rect x="165" y="522" width="80" height="75" rx="6" fill="#e74c3c"/>
  <text x="205" y="555" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="12" fill="#fff">右方</text>
  <text x="205" y="572" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="9" fill="#fde">90°</text>

  <rect x="255" y="522" width="80" height="75" rx="6" fill="#e74c3c"/>
  <text x="295" y="555" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="12" fill="#fff">后方</text>
  <text x="295" y="572" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="9" fill="#fde">180°</text>

  <rect x="345" y="522" width="80" height="75" rx="6" fill="#e74c3c"/>
  <text x="385" y="555" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="12" fill="#fff">左方</text>
  <text x="385" y="572" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="9" fill="#fde">270°</text>

  <!-- 回到步骤4的循环箭头 -->
  <path d="M 440 560 Q 470 560 470 295 Q 470 295 420 295" stroke="#555" stroke-width="2" fill="none" stroke-dasharray="5,3" marker-end="url(#a2)"/>
  <text x="478" y="430" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="11" fill="#555" transform="rotate(90 478 430)">下一个路径点</text>

  <!-- 步骤8：完成 -->
  <line x1="250" y1="610" x2="250" y2="635" stroke="#555" stroke-width="2" marker-end="url(#a2)"/>
  <rect x="100" y="635" width="300" height="50" rx="8" fill="#95a5a6"/>
  <text x="250" y="657" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="13" fill="#fff">8. 所有路径点巡逻完成</text>
  <text x="250" y="675" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="10" fill="#ecf0f1">照片保存在 patrol_photos/ 目录</text>

  <!-- 侧边注释 -->
  <rect x="410" y="340" width="80" height="35" rx="4" fill="#eaf2f8" stroke="#3498db" stroke-width="1" stroke-dasharray="3,2"/>
  <text x="450" y="362" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="9" fill="#2980b9">Nav2 导航</text>

  <rect x="410" y="415" width="80" height="35" rx="4" fill="#fef9e7" stroke="#f39c12" stroke-width="1" stroke-dasharray="3,2"/>
  <text x="450" y="437" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="9" fill="#d68910">TF 定位</text>

  <rect x="10" y="522" width="45" height="30" rx="4" fill="#fdf2f8" stroke="#e74c3c" stroke-width="1" stroke-dasharray="3,2"/>
  <text x="33" y="542" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="9" fill="#c0392b">拍照</text>

  <rect x="10" y="210" width="80" height="35" rx="4" fill="#fdf2f8" stroke="#e74c3c" stroke-width="1" stroke-dasharray="3,2"/>
  <text x="50" y="232" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="9" fill="#c0392b">语音服务</text>
</svg>
