<svg xmlns="http://www.w3.org/2000/svg" width="820" height="500" viewBox="0 0 820 500">
  <rect width="820" height="500" fill="#f8f9fa" rx="10"/>

  <text x="410" y="35" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="18" font-weight="700" fill="#2c3e50">Fishbot 巡逻机器人 - 系统架构</text>

  <!-- 第一层：应用层 -->
  <rect x="40" y="60" width="740" height="90" rx="8" fill="#fff5f5" stroke="#e74c3c" stroke-width="2"/>
  <text x="60" y="82" font-family="Microsoft YaHei, sans-serif" font-size="13" font-weight="600" fill="#c0392b">应用层</text>

  <rect x="70" y="95" width="200" height="45" rx="6" fill="#e74c3c"/>
  <text x="170" y="115" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="13" fill="#fff">巡逻节点</text>
  <text x="170" y="132" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="10" fill="#fde">导航 + 拍照 + 语音</text>

  <rect x="310" y="95" width="160" height="45" rx="6" fill="#e74c3c"/>
  <text x="390" y="115" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="13" fill="#fff">语音服务</text>
  <text x="390" y="132" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="10" fill="#fde">edge-tts 语音合成</text>

  <rect x="510" y="95" width="240" height="45" rx="6" fill="#3498db"/>
  <text x="630" y="115" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="13" fill="#fff">导航工具集</text>
  <text x="630" y="132" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="10" fill="#d5e8f3">单点导航 / 多点导航 / 获取位姿</text>

  <!-- 箭头：应用层→导航层 -->
  <line x1="170" y1="150" x2="300" y2="190" stroke="#555" stroke-width="2" marker-end="url(#a1)"/>
  <line x1="390" y1="150" x2="390" y2="190" stroke="#555" stroke-width="2" marker-end="url(#a1)"/>

  <!-- 第二层：SLAM + 导航层 -->
  <rect x="40" y="190" width="740" height="90" rx="8" fill="#eafaf1" stroke="#27ae60" stroke-width="2"/>
  <text x="60" y="212" font-family="Microsoft YaHei, sans-serif" font-size="13" font-weight="600" fill="#27ae60">建图与导航层</text>

  <rect x="70" y="225" width="200" height="45" rx="6" fill="#27ae60"/>
  <text x="170" y="245" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="13" fill="#fff">Cartographer 建图</text>
  <text x="170" y="262" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="10" fill="#d5f5e3">雷达+里程计 → 地图</text>

  <rect x="310" y="225" width="200" height="45" rx="6" fill="#27ae60"/>
  <text x="410" y="245" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="13" fill="#fff">Nav2 自主导航</text>
  <text x="410" y="262" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="10" fill="#d5f5e3">AMCL定位 + 路径规划</text>

  <rect x="550" y="225" width="200" height="45" rx="6" fill="#27ae60"/>
  <text x="650" y="245" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="13" fill="#fff">地图文件</text>
  <text x="650" y="262" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="10" fill="#d5f5e3">room.pgm / room.yaml</text>

  <!-- 箭头：导航层→驱动层 -->
  <line x1="170" y1="280" x2="170" y2="320" stroke="#555" stroke-width="2" marker-end="url(#a1)"/>
  <line x1="410" y1="280" x2="410" y2="320" stroke="#555" stroke-width="2" marker-end="url(#a1)"/>
  <line x1="650" y1="280" x2="650" y2="320" stroke="#555" stroke-width="2" marker-end="url(#a1)"/>

  <!-- 第三层：驱动层 -->
  <rect x="40" y="320" width="740" height="80" rx="8" fill="#f5eef8" stroke="#8e44ad" stroke-width="2"/>
  <text x="60" y="342" font-family="Microsoft YaHei, sans-serif" font-size="13" font-weight="600" fill="#8e44ad">驱动层</text>

  <rect x="60" y="355" width="130" height="38" rx="6" fill="#8e44ad"/>
  <text x="125" y="379" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="12" fill="#fff">激光雷达驱动</text>

  <rect x="210" y="355" width="130" height="38" rx="6" fill="#8e44ad"/>
  <text x="275" y="379" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="12" fill="#fff">里程计→TF</text>

  <rect x="360" y="355" width="130" height="38" rx="6" fill="#8e44ad"/>
  <text x="425" y="379" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="12" fill="#fff">机器人模型</text>

  <rect x="510" y="355" width="130" height="38" rx="6" fill="#8e44ad"/>
  <text x="575" y="379" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="12" fill="#fff">相机驱动</text>

  <rect x="660" y="355" width="100" height="38" rx="6" fill="#8e44ad"/>
  <text x="710" y="379" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="11" fill="#fff">串口桥接</text>

  <!-- 箭头：驱动层→硬件层 -->
  <line x1="125" y1="400" x2="125" y2="435" stroke="#555" stroke-width="2" marker-end="url(#a1)"/>
  <line x1="275" y1="400" x2="275" y2="435" stroke="#555" stroke-width="2" marker-end="url(#a1)"/>
  <line x1="425" y1="400" x2="425" y2="435" stroke="#555" stroke-width="2" marker-end="url(#a1)"/>
  <line x1="575" y1="400" x2="575" y2="435" stroke="#555" stroke-width="2" marker-end="url(#a1)"/>

  <!-- 第四层：硬件层 -->
  <rect x="40" y="435" width="740" height="50" rx="8" fill="#fef9e7" stroke="#f39c12" stroke-width="2"/>
  <text x="60" y="457" font-family="Microsoft YaHei, sans-serif" font-size="13" font-weight="600" fill="#d68910">硬件层</text>

  <text x="200" y="465" font-family="Microsoft YaHei, sans-serif" font-size="12" fill="#d68910">YDLidar</text>
  <text x="320" y="465" font-family="Microsoft YaHei, sans-serif" font-size="12" fill="#d68910">STM32</text>
  <text x="430" y="465" font-family="Microsoft YaHei, sans-serif" font-size="12" fill="#d68910">URDF模型</text>
  <text x="560" y="465" font-family="Microsoft YaHei, sans-serif" font-size="12" fill="#d68910">ESP32摄像头</text>
  <text x="690" y="465" font-family="Microsoft YaHei, sans-serif" font-size="12" fill="#d68910">扬声器</text>

  <defs>
    <marker id="a1" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#555"/>
    </marker>
  </defs>
</svg>
